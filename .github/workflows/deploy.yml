name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # 公開先は独自ドメイン（https://umeda.enludus.com/）の直下。変えるときはリポジトリ変数で上書きする（docs/DEPLOY.md）
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          # 共有カード（OGP）の画像の絶対URLに使う
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://umeda.enludus.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
